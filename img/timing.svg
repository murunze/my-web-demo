<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f6f2"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b4636" font-family="sans-serif">校表仪音迹分析与走时质量检验</text>
  <rect x="50" y="60" width="360" height="200" rx="10" fill="#ffffff" stroke="#8a7250" stroke-width="2.5"/>
  <line x1="70" y1="160" x2="390" y2="160" stroke="#c9bfae" stroke-width="1"/>
  <g stroke-linecap="round">
    <line x1="70" y1="112" x2="390" y2="112" stroke="#4a6a8a" stroke-width="2"/>
    <line x1="70" y1="128" x2="390" y2="128" stroke="#8a7250" stroke-width="2"/>
    <line x1="70" y1="176" x2="390" y2="176" stroke="#8a7250" stroke-width="2"/>
    <line x1="70" y1="192" x2="390" y2="192" stroke="#4a6a8a" stroke-width="2"/>
  </g>
  <g fill="#5b4636" font-family="monospace" font-size="12">
    <text x="86" y="105">+10 s/d</text>
    <text x="86" y="125">0 s/d</text>
    <text x="86" y="212">-10 s/d</text>
  </g>
  <path d="M300 112 L360 128 M300 176 L360 192" stroke="#b8452e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="330" y="86" text-anchor="middle" font-size="11" fill="#b8452e" font-family="sans-serif">偏振 / 音迹夹角</text>
  <text x="230" y="290" text-anchor="middle" font-size="12" fill="#7a6a52" font-family="sans-serif">音迹线条：平行=正常 | 分叉或杂乱=齿轮啮合/轴承故障</text>
  <g transform="translate(500,120)">
    <circle r="40" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M0 -40 L0 -20 M28 -28 L14 -14 M40 0 L20 0" stroke="#5b4636" stroke-width="3"/>
    <text x="0" y="-56" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">日差</text>
  </g>
  <g transform="translate(500,230)">
    <circle r="40" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M-30 20 A40 40 0 0 1 30 -20" fill="none" stroke="#b8452e" stroke-width="4"/>
    <text x="0" y="-56" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">振幅 / 摆幅</text>
  </g>
  <text x="320" y="338" text-anchor="middle" font-size="12" fill="#7a6a52" font-family="sans-serif">检验项目依据 QB/T 1249 等：瞬时日差、平均日差、温度系数、位置误差、延续走时</text>
</svg>
