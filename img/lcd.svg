<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f6f2"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b4636" font-family="sans-serif">液晶显示手表构成与显示原理</text>
  <g transform="translate(160,180)">
    <rect x="-90" y="-50" width="180" height="100" rx="10" fill="#e8dcc0" stroke="#8a7250" stroke-width="3"/>
    <g fill="#5b4636" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle">
      <text x="-38" y="14">88</text>
      <text x="34" y="14">88</text>
      <text x="0" y="-16" font-size="12">AM</text>
      <text x="0" y="42" font-size="12">2026-10-10</text>
    </g>
    <text x="0" y="-62" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">液晶显示屏（段码 / 点阵）</text>
  </g>
  <g transform="translate(430,180)">
    <rect x="-100" y="-56" width="200" height="112" rx="8" fill="#d9c9a8" stroke="#8a7250" stroke-width="2.5"/>
    <rect x="-70" y="-32" width="60" height="64" rx="4" fill="#5b4636"/>
    <text x="-40" y="6" text-anchor="middle" font-size="11" fill="#f8f6f2" font-family="sans-serif">驱动IC</text>
    <circle cx="46" cy="0" r="26" fill="#c4a675" stroke="#8a7250" stroke-width="2.5"/>
    <text x="46" y="5" text-anchor="middle" font-size="11" fill="#5b4636" font-family="sans-serif">电池</text>
    <text x="0" y="76" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">PCB 电路板 + 驱动芯片 + 纽扣电池</text>
  </g>
  <path d="M250 180 L330 180" stroke="#8a7250" stroke-width="3"/>
  <text x="290" y="170" text-anchor="middle" font-size="11" fill="#7a6a52" font-family="sans-serif">段码信号</text>
  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#7a6a52" font-family="sans-serif">石英振子(32768Hz) → 分频电路 → 计数/译码 → 驱动液晶段电极，加电场使液晶分子偏转 → 显示数字</text>
</svg>
