<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f6f2"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b4636" font-family="sans-serif">经典板路布局（夹板结构）对比</text>
  <g transform="translate(130,195)">
    <circle r="82" fill="#e8dcc0" stroke="#8a7250" stroke-width="3"/>
    <circle r="82" fill="none" stroke="#b09a72" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle cx="-30" cy="-26" r="20" fill="none" stroke="#8a7250" stroke-width="2"/>
    <circle cx="26" cy="-30" r="14" fill="none" stroke="#8a7250" stroke-width="2"/>
    <circle cx="34" cy="28" r="18" fill="none" stroke="#8a7250" stroke-width="2"/>
    <text x="0" y="-96" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">Lepine（敞开式）</text>
    <text x="0" y="112" text-anchor="middle" font-size="11" fill="#7a6a52" font-family="sans-serif">夹板少、可见轮系多</text>
  </g>
  <g transform="translate(320,195)">
    <circle r="82" fill="#e8dcc0" stroke="#8a7250" stroke-width="3"/>
    <path d="M0 -82 A82 82 0 0 1 0 82 L0 -82 Z" fill="#d9c9a8" stroke="#8a7250" stroke-width="3"/>
    <circle cx="-34" cy="-20" r="18" fill="none" stroke="#8a7250" stroke-width="2"/>
    <circle cx="-30" cy="30" r="16" fill="none" stroke="#8a7250" stroke-width="2"/>
    <text x="0" y="-96" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">Savonette（猎表式）</text>
    <text x="0" y="112" text-anchor="middle" font-size="11" fill="#7a6a52" font-family="sans-serif">半遮盖、结构对称</text>
  </g>
  <g transform="translate(510,195)">
    <circle r="82" fill="#e8dcc0" stroke="#8a7250" stroke-width="3"/>
    <path d="M-82 -14 A82 82 0 0 1 82 -14 L82 82 L-82 82 Z" fill="#d9c9a8" stroke="#8a7250" stroke-width="3"/>
    <circle cx="-24" cy="-40" r="20" fill="none" stroke="#8a7250" stroke-width="2"/>
    <circle cx="30" cy="-36" r="14" fill="none" stroke="#8a7250" stroke-width="2"/>
    <text x="0" y="-96" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">四分之三（3/4）</text>
    <text x="0" y="112" text-anchor="middle" font-size="11" fill="#7a6a52" font-family="sans-serif">大夹板覆盖、稳固</text>
  </g>
  <text x="320" y="344" text-anchor="middle" font-size="12" fill="#7a6a52" font-family="sans-serif">「三加一」夹板构造（主夹板 + 条盒夹板 + 摆夹板 + 轮系夹板）为主流板路形式</text>
</svg>
