<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f6f2"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b4636" font-family="sans-serif">杠杆式擒纵机构（擒纵轮 / 擒纵叉 / 摆轮）</text>
  <g transform="translate(170,200)">
    <circle r="70" fill="#e8dcc0" stroke="#8a7250" stroke-width="3"/>
    <g fill="#c4a675" stroke="#8a7250" stroke-width="1.5">
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(0)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(30)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(60)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(90)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(120)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(150)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(180)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(210)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(240)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(270)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(300)"/>
      <path d="M0 -70 l10 -16 l10 16 z" transform="rotate(330)"/>
    </g>
    <circle r="7" fill="#5b4636"/>
  </g>
  <text x="170" y="300" text-anchor="middle" font-size="13" fill="#5b4636" font-family="sans-serif">擒纵轮（20 齿）</text>
  <g stroke="#8a7250" fill="#d9c9a8" stroke-width="3">
    <path d="M300 200 L300 138" stroke-linecap="round"/>
    <path d="M282 200 L318 200 L312 210 L288 210 Z"/>
  </g>
  <path d="M300 138 L266 108" stroke="#b8452e" stroke-width="6" stroke-linecap="round"/>
  <path d="M300 138 L334 108" stroke="#4a6a8a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="200" r="9" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
  <text x="258" y="96" text-anchor="middle" font-size="12" fill="#b8452e" font-family="sans-serif">进瓦</text>
  <text x="344" y="96" text-anchor="middle" font-size="12" fill="#4a6a8a" font-family="sans-serif">出瓦</text>
  <text x="300" y="300" text-anchor="middle" font-size="13" fill="#5b4636" font-family="sans-serif">擒纵叉（直马）</text>
  <g transform="translate(500,200)">
    <circle r="76" fill="none" stroke="#8a7250" stroke-width="8"/>
    <circle r="66" fill="none" stroke="#b09a72" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle r="7" fill="#5b4636"/>
  </g>
  <path d="M500 200 q40 -14 30 -46" fill="none" stroke="#4a6a8a" stroke-width="3"/>
  <text x="500" y="120" text-anchor="middle" font-size="12" fill="#4a6a8a" font-family="sans-serif">游丝</text>
  <text x="500" y="300" text-anchor="middle" font-size="13" fill="#5b4636" font-family="sans-serif">摆轮（振动系统）</text>
  <text x="320" y="336" text-anchor="middle" font-size="12" fill="#7a6a52" font-family="sans-serif">擒纵叉来回摆动一次，擒纵轮转过一个齿；同时补充摆轮每次振动损耗的能量</text>
</svg>
