<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f6f2"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b4636" font-family="sans-serif">机械手表整机装配工艺流程</text>
  <g font-family="sans-serif" font-size="12">
    <rect x="30" y="120" width="100" height="60" rx="8" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <text x="80" y="146" text-anchor="middle" fill="#5b4636">① 清洗</text>
    <text x="80" y="164" text-anchor="middle" fill="#7a6a52" font-size="10">零件去油去污</text>
    <path d="M130 150 L166 150" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M158 144 L168 150 L158 156 Z" fill="#8a7250"/>

    <rect x="170" y="120" width="100" height="60" rx="8" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <text x="220" y="146" text-anchor="middle" fill="#5b4636">② 主夹板</text>
    <text x="220" y="164" text-anchor="middle" fill="#7a6a52" font-size="10">装轴承/轮系</text>
    <path d="M270 150 L306 150" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M298 144 L308 150 L298 156 Z" fill="#8a7250"/>

    <rect x="310" y="120" width="100" height="60" rx="8" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <text x="360" y="146" text-anchor="middle" fill="#5b4636">③ 装原动/轮系</text>
    <text x="360" y="164" text-anchor="middle" fill="#7a6a52" font-size="10">点油</text>
    <path d="M410 150 L446 150" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M438 144 L448 150 L438 156 Z" fill="#8a7250"/>

    <rect x="450" y="120" width="100" height="60" rx="8" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <text x="500" y="146" text-anchor="middle" fill="#5b4636">④ 装擒纵/摆</text>
    <text x="500" y="164" text-anchor="middle" fill="#7a6a52" font-size="10">调速器</text>
    <path d="M550 150 L586 150" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M578 144 L588 150 L578 156 Z" fill="#8a7250"/>

    <rect x="450" y="240" width="100" height="60" rx="8" fill="#f0dfd8" stroke="#b8452e" stroke-width="2.5"/>
    <text x="500" y="266" text-anchor="middle" fill="#7a3325">⑤ 装指针/盘</text>
    <text x="500" y="284" text-anchor="middle" fill="#b8452e" font-size="10">对位装配</text>
    <path d="M500 180 L500 240" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M494 232 L500 242 L506 232 Z" fill="#8a7250"/>

    <rect x="280" y="240" width="110" height="60" rx="8" fill="#e0e6ea" stroke="#4a6a8a" stroke-width="2.5"/>
    <text x="335" y="266" text-anchor="middle" fill="#2f4356">⑥ 走时调校</text>
    <text x="335" y="284" text-anchor="middle" fill="#4a6a8a" font-size="10">校表仪检测</text>
    <path d="M450 270 L390 270" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M398 264 L388 270 L398 276 Z" fill="#8a7250"/>

    <rect x="110" y="240" width="110" height="60" rx="8" fill="#e0e6ea" stroke="#4a6a8a" stroke-width="2.5"/>
    <text x="165" y="266" text-anchor="middle" fill="#2f4356">⑦ 装壳合壳</text>
    <text x="165" y="284" text-anchor="middle" fill="#4a6a8a" font-size="10">防水检测</text>
    <path d="M280 270 L220 270" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M228 264 L218 270 L228 276 Z" fill="#8a7250"/>
  </g>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#7a6a52" font-family="sans-serif">关键控制点：轮系啮合间隙、擒纵叉锁值与落值、注油量（宁少勿多）、指针装配平行度</text>
</svg>
