<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f6f2"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#5b4636" font-family="sans-serif">机械摆钟摆动系统示意图</text>
  <rect x="290" y="50" width="60" height="26" rx="4" fill="#d9c9a8" stroke="#8a7250" stroke-width="2.5"/>
  <text x="320" y="68" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">摆杆悬挂点</text>
  <line x1="320" y1="76" x2="320" y2="150" stroke="#8a7250" stroke-width="4"/>
  <circle cx="320" cy="160" r="6" fill="#5b4636"/>
  <text x="352" y="164" font-size="12" fill="#7a6a52" font-family="sans-serif">摆杆（有效摆长 L）</text>
  <circle cx="320" cy="250" r="46" fill="#c4a675" stroke="#8a7250" stroke-width="3"/>
  <text x="320" y="255" text-anchor="middle" font-size="13" fill="#3d2f20" font-family="sans-serif">摆锤</text>
  <line x1="320" y1="296" x2="320" y2="318" stroke="#8a7250" stroke-width="3"/>
  <circle cx="320" cy="322" r="7" fill="#8a7250"/>
  <text x="352" y="326" font-size="12" fill="#7a6a52" font-family="sans-serif">调节螺母（调摆长→校走时）</text>
  <path d="M250 190 q70 -36 140 0" fill="none" stroke="#b8452e" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M250 190 q70 36 140 0" fill="none" stroke="#4a6a8a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="185" y="160" font-size="12" fill="#b8452e" font-family="sans-serif">摆动方向</text>
  <text x="500" y="120" font-size="13" fill="#5b4636" font-family="sans-serif">T = 2π√(L/g)</text>
  <text x="500" y="140" font-size="11" fill="#7a6a52" font-family="sans-serif">周期仅与摆长和重力加速度有关</text>
  <text x="500" y="158" font-size="11" fill="#7a6a52" font-family="sans-serif">与摆锤质量基本无关</text>
</svg>
