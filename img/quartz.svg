<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f6f2"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#5b4636" font-family="sans-serif">指针式石英钟走时原理框图</text>
  <rect x="40" y="80" width="130" height="56" rx="8" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
  <text x="105" y="104" text-anchor="middle" font-size="13" fill="#5b4636" font-family="sans-serif">电池 1.55V</text>
  <text x="105" y="122" text-anchor="middle" font-size="11" fill="#7a6a52" font-family="sans-serif">（能量来源）</text>
  <rect x="220" y="80" width="150" height="56" rx="8" fill="#e0e6ea" stroke="#4a6a8a" stroke-width="2.5"/>
  <text x="295" y="104" text-anchor="middle" font-size="13" fill="#2f4356" font-family="sans-serif">石英晶振</text>
  <text x="295" y="122" text-anchor="middle" font-size="11" fill="#4a6a8a" font-family="sans-serif">32768 Hz</text>
  <rect x="420" y="80" width="180" height="56" rx="8" fill="#e0e6ea" stroke="#4a6a8a" stroke-width="2.5"/>
  <text x="510" y="104" text-anchor="middle" font-size="13" fill="#2f4356" font-family="sans-serif">CMOS 分频电路</text>
  <text x="510" y="122" text-anchor="middle" font-size="11" fill="#4a6a8a" font-family="sans-serif">15 级分频 → 1 Hz</text>
  <line x1="170" y1="108" x2="220" y2="108" stroke="#8a7250" stroke-width="2.5"/>
  <line x1="370" y1="108" x2="420" y2="108" stroke="#4a6a8a" stroke-width="2.5"/>
  <line x1="510" y1="136" x2="510" y2="170" stroke="#4a6a8a" stroke-width="2.5"/>
  <rect x="420" y="170" width="180" height="56" rx="8" fill="#f0dfd8" stroke="#b8452e" stroke-width="2.5"/>
  <text x="510" y="194" text-anchor="middle" font-size="13" fill="#7a3325" font-family="sans-serif">步进电机</text>
  <text x="510" y="212" text-anchor="middle" font-size="11" fill="#b8452e" font-family="sans-serif">每秒转 180°</text>
  <line x1="420" y1="198" x2="360" y2="198" stroke="#b8452e" stroke-width="2.5"/>
  <rect x="200" y="170" width="160" height="56" rx="8" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
  <text x="280" y="194" text-anchor="middle" font-size="13" fill="#5b4636" font-family="sans-serif">减速轮系</text>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#7a6a52" font-family="sans-serif">秒轮 / 分轮 / 时轮</text>
  <line x1="200" y1="198" x2="150" y2="198" stroke="#8a7250" stroke-width="2.5"/>
  <rect x="30" y="170" width="120" height="56" rx="8" fill="#d9c9a8" stroke="#8a7250" stroke-width="2.5"/>
  <text x="90" y="194" text-anchor="middle" font-size="13" fill="#5b4636" font-family="sans-serif">指针指示</text>
  <text x="90" y="212" text-anchor="middle" font-size="11" fill="#7a6a52" font-family="sans-serif">时 / 分 / 秒</text>
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="#7a6a52" font-family="sans-serif">日误差一般 ≤ ±0.5 秒 · 免上链 · 维护成本低</text>
</svg>
