<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f8f6f2"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b4636" font-family="sans-serif">离合控制装置（拨针系）三档位示意</text>
  <line x1="60" y1="190" x2="170" y2="190" stroke="#8a7250" stroke-width="10" stroke-linecap="round"/>
  <text x="115" y="170" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">柄轴（把挺）</text>
  <g transform="translate(200,120)">
    <rect x="-16" y="-46" width="32" height="92" rx="6" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <path d="M-16 -20 L16 -20 M-16 4 L16 4 M-16 28 L16 28" stroke="#b09a72" stroke-width="2"/>
    <text x="0" y="-56" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">离合杆</text>
  </g>
  <g transform="translate(300,190)">
    <circle r="46" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <circle r="30" fill="none" stroke="#b09a72" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="34" cy="-40" r="10" fill="#c4a675" stroke="#8a7250" stroke-width="2"/>
    <text x="0" y="70" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">离合轮</text>
  </g>
  <g transform="translate(440,190)">
    <circle r="34" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <circle r="18" fill="none" stroke="#b09a72" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="0" y="58" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">拨针轮</text>
  </g>
  <g transform="translate(556,190)">
    <circle r="26" fill="#e8dcc0" stroke="#8a7250" stroke-width="2.5"/>
    <text x="0" y="50" text-anchor="middle" font-size="12" fill="#5b4636" font-family="sans-serif">跨轮</text>
  </g>
  <path d="M246 150 L254 150" stroke="#8a7250" stroke-width="3"/>
  <path d="M346 168 L406 178" stroke="#8a7250" stroke-width="3"/>
  <path d="M474 190 L530 190" stroke="#8a7250" stroke-width="3"/>
  <g font-size="12" font-family="sans-serif">
    <text x="200" y="292" text-anchor="middle" fill="#b8452e">档位 0</text>
    <text x="200" y="310" text-anchor="middle" fill="#7a6a52">柄轴推到底：上条 / 手动补链</text>
  </g>
  <g font-size="12" font-family="sans-serif">
    <text x="370" y="292" text-anchor="middle" fill="#b8452e">档位 1</text>
    <text x="370" y="310" text-anchor="middle" fill="#7a6a52">拉出一档：拨针（调时）</text>
  </g>
  <g font-size="12" font-family="sans-serif">
    <text x="556" y="292" text-anchor="middle" fill="#b8452e">档位 2</text>
    <text x="556" y="310" text-anchor="middle" fill="#7a6a52">拉出二档：快速调校（日历/双时区）</text>
  </g>
  <text x="320" y="344" text-anchor="middle" font-size="12" fill="#7a6a52" font-family="sans-serif">离合杆带动离合轮在柄轴上滑移，实现「上条 / 拨针 / 快调」三种功能切换</text>
</svg>
